                        </button>

                        <!-- Telegram -->
                        <button class="uc-messenger-card" id="uc-ms-tg" type="button">
                            <img class="uc-messenger-icon uc-messenger-icon--circle"
                                 src="https://static.tildacdn.com/tild3063-3137-4532-b562-363666363666/Telegram_logo.png"
                                 alt="Telegram"
                                 style="box-shadow:0 4px 14px rgba(41,162,220,.18);">
                            <span class="uc-messenger-card-name">Telegram</span>
                            <span class="uc-messenger-card-desc">Нажмите ЗАПУСТИТЬ<br>после перехода</span>
                        </button>

                    </div>
                </div>

                <!-- Секция «ПО ТЕЛЕФОНУ» (скрыта по умолчанию) -->
                <div id="uc-calc-phone-section" class="uc-calc-phone-section uc-calc-tabpanel" style="display:none;">
                    <p class="uc-calc-phone-hint">Укажите Ваше Имя и Номер телефона для связи</p>
                    <div class="uc-calc-phone-row">
                        <div class="uc-calc-phone-field">
                            <label class="uc-calc-phone-label" for="uc-calc-name">Имя</label>
                            <input id="uc-calc-name" class="uc-calc-input" type="text"
                                   placeholder="Ваше имя" autocomplete="given-name">
                        </div>
                        <div class="uc-calc-phone-field">
                            <label class="uc-calc-phone-label" for="uc-calc-phone">Телефон</label>
                            <input id="uc-calc-phone" class="uc-calc-input" type="tel"
                                   placeholder="+7 (___) ___-__-__" autocomplete="tel">
                        </div>
                    </div>
                </div>

            </div>

            <!-- Чекбоксы согласий (рендерятся из .uc-tildaform) -->
            <div class="uc-calc-agreements" id="uc-calc-agreements"></div>

            <!-- Ошибка валидации -->
            <div class="uc-calc-error" id="uc-calc-error"></div>

            <!-- Навигация (НАЗАД — квизовый back; ДАЛЕЕ/ОТПРАВИТЬ — финальный submit) -->
            <div class="uc-calc-nav">
                <button class="uc-quiz-btn-back" id="uc-gal-back" type="button">← НАЗАД</button>
                <button class="uc-quiz-btn-next" id="uc-gal-submit" type="button">ДАЛЕЕ →</button>
            </div>

        </div>
    </div>
</div>

<!-- Лайтбокс (без изменений) -->
<div id="uc-gallery-lightbox" role="dialog" aria-modal="true">
    <button class="uc-lb-close" type="button" aria-label="Закрыть">&#215;</button>
    <button class="uc-lb-prev" type="button" aria-label="Назад">&#8249;</button>
    <img src="" alt="" id="uc-lb-img">
    <div class="uc-lb-counter" id="uc-lb-counter"></div>
    <button class="uc-lb-next" type="button" aria-label="Вперёд">&#8250;</button>
</div>

<script>
(function () {

    var galleryUrls     = [];
    var currentGalIndex = 0;
    var lbIndex         = 0;
    var galSwiper       = null;
    var _lastUseLoop    = null; // R9: loop parameter of the current galSwiper instance

    /* ================================================================
       CALC-SECTION: состояние
    ================================================================ */
    var calcOffer     = 'В чате';   // 'В чате' | 'По телефону'
    var calcMessenger = 'web';      // 'web' | 'MAX' | 'Telegram'
    var CALC_DESKTOP  = 480;        // px — порог desktop/mobile

    function initCalcState() {
        if ($(window).width() > CALC_DESKTOP) {
            calcMessenger = 'web';
            $('#uc-ms-site').show().addClass('uc-messenger-card--active');
            $('#uc-ms-max, #uc-ms-tg').removeClass('uc-messenger-card--active');
        } else {
            $('#uc-ms-site').hide();
            if (calcMessenger === 'web') calcMessenger = 'MAX';
            $('#uc-ms-max').toggleClass('uc-messenger-card--active', calcMessenger === 'MAX');
            $('#uc-ms-tg').toggleClass('uc-messenger-card--active', calcMessenger === 'Telegram');
        }
        updateCalcBtnText();
    }

    function updateCalcBtnText() {
        var text = (calcOffer === 'По телефону') ? 'ОТПРАВИТЬ' : 'ДАЛЕЕ →';
        $('#uc-gal-submit').text(text);
    }

    function renderCalcAgreements() {
        var $container = $('#uc-calc-agreements').empty();
        var $cbGroups  = $('.uc-tildaform .t-input-group_cb');
        if (!$cbGroups.length) return;

        $cbGroups.each(function (idx) {
            var $group    = $(this);
            var $realCb   = $group.find('input[type="checkbox"]');
            var $lblClone = $group.find('label.t-checkbox__control').clone();
            $lblClone.find('input[type="checkbox"], div.t-checkbox__indicator').remove();
            var titleHtml = $lblClone.html().trim();
            var isChecked = $realCb.prop('checked') !== false;

            var $item = $('<div class="uc-calc-agr-item' +
                (isChecked ? ' uc-agr-checked' : '') +
                '" data-agr-idx="' + idx + '">' +
                '<div class="uc-calc-agr-check"></div>' +
                '<span class="uc-calc-agr-text">' + titleHtml + '</span>' +
                '</div>');

            $item.on('click', function (e) {
                if ($(e.target).is('a')) return;
                $(this).toggleClass('uc-agr-checked');
            });

            $container.append($item);
        });
    }

    function syncCalcAgreements() {
        $('.uc-tildaform .t-input-group_cb').each(function (idx) {
            var $realCb = $(this).find('input[type="checkbox"]');
            var isVisualChecked = $('#uc-calc-agreements [data-agr-idx="' + idx + '"]')
                .hasClass('uc-agr-checked');
            $realCb.prop('checked', isVisualChecked);
        });
    }

    /* ================================================================
       Инициализация при загрузке данных — вызывается из U2
    ================================================================ */
    window.initGallery = function (airData) {
        if (!airData || !airData.length) return;
        var sorted = airData.slice().sort(function (a, b) {
            return Number(a.fields['Complectation id'] || 0) - Number(b.fields['Complectation id'] || 0);
        });
        window.updateGallery(sorted[0]);
    };

    /* ================================================================
       Основная функция — вызывается из selectComplectation (U3)
    ================================================================ */
    window.updateGallery = function (car) {
        var pics   = (car && car.fields && car.fields['Pics']) || [];
        var botUrl = window.UNIFIEDBOT_URL || '';

        galleryUrls = [];
        for (var i = 0; i < pics.length; i++) {
            var p   = pics[i];
            var raw = p.url || p.signedPath || p.path || '';
            if (!raw) continue;
            galleryUrls.push(
                raw.startsWith('http') ? raw : botUrl + '/' + raw.replace(/^\//, '')
            );
        }

        if (!galleryUrls.length) {
            $('#uc-gallery-custom').hide();
            return;
        }

        currentGalIndex = 0;
        var useLoop = galleryUrls.length > 1;

        /* R9: update slides in place only when both old and new state have loop=false.
           Loop mode always uses destroy+recreate to ensure slideChangeTransitionEnd
           listener is re-registered on the fresh Swiper instance. */
        if (galSwiper && !useLoop && !_lastUseLoop
                && typeof galSwiper.removeAllSlides === 'function') {
            galSwiper.removeAllSlides();
            var $wrapperInPlace = $('#uc-gal-swiper-wrapper');
            galleryUrls.forEach(function (url) {
                $wrapperInPlace.append(
                    '<div class="swiper-slide">' +
                    '<img src="' + url + '" alt="" loading="lazy"' +
                    ' style="width:100%;height:100%;object-fit:contain;">' +
                    '</div>'
                );
            });
            galSwiper.update();
            galSwiper.slideTo(0, 0, false);
            renderThumbs();
        } else {
            /* First init or loop parameter changed: destroy + recreate */
            if (galSwiper) {
                galSwiper.destroy(true, true);
                galSwiper = null;
            }

            var $wrapper = $('#uc-gal-swiper-wrapper').empty();
            galleryUrls.forEach(function (url) {
                $wrapper.append(
                    '<div class="swiper-slide">' +
                    '<img src="' + url + '" alt="" loading="lazy"' +
                    ' style="width:100%;height:100%;object-fit:contain;">' +
                    '</div>'
                );
            });

            renderThumbs();

            setTimeout(function () {
                galSwiper = new Swiper('#uc-gal-swiper', {
                    slidesPerView: 1,
                    loop: useLoop,
                    speed: 350,
                    allowTouchMove: true
                });

                galSwiper.on('slideChangeTransitionEnd', function () {
                    currentGalIndex = galSwiper.activeIndex;
                    renderThumbs();
                });

                _lastUseLoop = useLoop;
            }, 0);
        }

        $('#uc-gallery-custom').show();
    };

    /* ================================================================
       Рендер миниатюр
    ================================================================ */
    function renderThumbs() {
        var thumbHtml = '';
        for (var i = 0; i < galleryUrls.length; i++) {
            thumbHtml +=
                '<div class="gal-thumb' + (i === currentGalIndex ? ' active' : '') + '"' +
                ' data-idx="' + i + '"' +
                ' style="background-image:url(\'' + galleryUrls[i] + '\')">' +
                '</div>';
        }
        $('#uc-gal-thumbs').html(thumbHtml);
    }

    /* ================================================================
       Навигация: кнопки и миниатюры
    ================================================================ */
    $(document).on('click', '#uc-gal-prev', function () {
        if (galSwiper) galSwiper.slidePrev();
    });

    $(document).on('click', '#uc-gal-next', function () {
        if (galSwiper) galSwiper.slideNext();
    });

    $(document).on('click', '#uc-gal-thumbs .gal-thumb', function () {
        var idx = parseInt($(this).attr('data-idx'), 10);
        if (!galSwiper) return;
        if (galSwiper.params && galSwiper.params.loop) {
            galSwiper.slideToLoop(idx, 350);
        } else {
            galSwiper.slideTo(idx, 350);
        }
        currentGalIndex = idx;
        renderThumbs();
    });

    /* ================================================================
       Лайтбокс (без изменений; открытие по клику на фото убрано)
    ================================================================ */
    var lbIndex = 0;

    function openLightbox(idx) {
        if (!galleryUrls.length) return;
        lbIndex = ((idx % galleryUrls.length) + galleryUrls.length) % galleryUrls.length;
        showLbPhoto(lbIndex);
        $('#uc-gallery-lightbox').addClass('uc-lb-open');
        $('body').css('overflow', 'hidden');
    }

    function showLbPhoto(idx) {
        lbIndex = ((idx % galleryUrls.length) + galleryUrls.length) % galleryUrls.length;
        $('#uc-lb-img').attr('src', galleryUrls[lbIndex]);
        $('#uc-lb-counter').text((lbIndex + 1) + ' / ' + galleryUrls.length);
    }

    $(document).on('click', '#uc-gallery-lightbox .uc-lb-close', closeLightbox);
    $(document).on('click', '#uc-gallery-lightbox .uc-lb-prev', function () { showLbPhoto(lbIndex - 1); });
    $(document).on('click', '#uc-gallery-lightbox .uc-lb-next', function () { showLbPhoto(lbIndex + 1); });

    $(document).on('click', '#uc-gallery-lightbox', function (e) {
        if ($(e.target).is('#uc-gallery-lightbox')) closeLightbox();
    });

    $(document).on('keydown', function (e) {
        if (!$('#uc-gallery-lightbox').hasClass('uc-lb-open')) return;
        if (e.key === 'Escape')     closeLightbox();
        if (e.key === 'ArrowLeft')  showLbPhoto(lbIndex - 1);
        if (e.key === 'ArrowRight') showLbPhoto(lbIndex + 1);
    });

    function closeLightbox() {
        $('#uc-gallery-lightbox').removeClass('uc-lb-open');
        $('body').css('overflow', '');
    }

    /* ================================================================
       КВИЗ ШАГ 2: fillGalInfo — info-строка + spec-пиллсы
    ================================================================ */
    function fillGalInfo(car) {
        if (!car || !car.fields) return;
        var f    = car.fields;
        var model = f['Model'] || '';
        var compl = f['Complectation'] || '';
        $('#uc-gal-info').text(model + (model && compl ? ' · ' : '') + compl);

        var specs = [
            { label: 'Двигатель',  key: 'Engine' },
            { label: 'Коробка',    key: 'Transmission_ru' },
            { label: 'Привод',     key: 'Drivetrain_ru' },
            { label: 'Разгон',     key: 'Acceleration' },
            { label: 'Расход',     key: 'Сonsumption' },
            // ПРАВКА 5: оба варианта написания поля клиренса
            { label: 'Клиренс',    key: 'clearance', fallback: 'Clearance' }
        ];

        var html = '';
        specs.forEach(function (s) {
            var val = f[s.key] || (s.fallback ? f[s.fallback] : '');
            if (!val) return;
            html += '<div class="uc-spec-card">' +
                    '<div class="uc-spec-value">' + esc(val) + '</div>' +
                    '<div class="uc-spec-label">' + esc(s.label) + '</div>' +
                    '</div>';
        });
        $('#uc-gal-specs').html(html);
        setTimeout(updateSpecsFade, 0);
        var specsEl = document.getElementById('uc-gal-specs');
        if (specsEl) {
            specsEl.removeEventListener('scroll', updateSpecsFade);
            specsEl.addEventListener('scroll', updateSpecsFade, { passive: true });
        }
    }

    function updateSpecsFade() {
        var sc = document.getElementById('uc-gal-specs');
        var wr = document.getElementById('uc-specs-scroll-wrap');
        if (!sc || !wr) return;
        var atLeft  = sc.scrollLeft <= 1;
        var atRight = sc.scrollLeft + sc.clientWidth >= sc.scrollWidth - 1;
        wr.classList.toggle('show-left',  !atLeft);
        wr.classList.toggle('show-right', !atRight);
    }

    /* ── Переключение карточек «В чате» / «По телефону» ── */
    $(document).on('click', '.uc-calc-method-btn', function () {
        $('.uc-calc-method-btn').removeClass('uc-calc-method-btn--active');
        $(this).addClass('uc-calc-method-btn--active');
        calcOffer = $(this).data('calc-tab') === 'chat' ? 'В чате' : 'По телефону';

        if (calcOffer === 'В чате') {
            $('#uc-calc-chat-section').show();
            $('#uc-calc-phone-section').hide();
            $('.uc-tildaform input[name="name"], .uc-tildaform input[name="phone"]')
                .prop('disabled', true);
            initCalcState();
        } else {
            $('#uc-calc-chat-section').hide();
            $('#uc-calc-phone-section').show();
            $('.uc-tildaform input[name="name"], .uc-tildaform input[name="phone"]')
                .prop('disabled', false);
        }
        $('#uc-calc-error').hide();
        $('#uc-calc-name, #uc-calc-phone').removeClass('uc-calc-input--error');
        updateCalcBtnText();
    });

    /* ── Выбор карточки мессенджера ── */
    $(document).on('click', '#uc-ms-site', function () {
        calcMessenger = 'web';
        setActiveMessengerCard('site');
    });
    $(document).on('click', '#uc-ms-max', function () {
        calcMessenger = 'MAX';
        setActiveMessengerCard('max');
    });
    $(document).on('click', '#uc-ms-tg', function () {
        calcMessenger = 'Telegram';
        setActiveMessengerCard('tg');
    });

    function setActiveMessengerCard(which) {
        $('#uc-ms-site, #uc-ms-max, #uc-ms-tg').removeClass('uc-messenger-card--active');
        $('#uc-ms-' + which).addClass('uc-messenger-card--active');
    }

    /* ── Сброс ошибки при вводе ── */
    $(document).on('input', '#uc-calc-name, #uc-calc-phone', function () {
        $(this).removeClass('uc-calc-input--error');
        if (!$('.uc-calc-input--error').length) {
            $('#uc-calc-error').hide();
        }
    });

    /* ── Финальная кнопка submit ── */
    $(document).on('click', '#uc-gal-submit', function () {
        $('#uc-calc-name, #uc-calc-phone').removeClass('uc-calc-input--error');
        $('#uc-calc-error').hide();

        if (calcOffer === 'По телефону') {
            var name  = $('#uc-calc-name').val().trim();
            var phone = $('#uc-calc-phone').val().trim();
            if (!name || !phone) {
                if (!name)  $('#uc-calc-name').addClass('uc-calc-input--error');
                if (!phone) $('#uc-calc-phone').addClass('uc-calc-input--error');
                $('#uc-calc-error').text('Пожалуйста, заполните имя и телефон').show();
                return;
            }
        }

        syncCalcAgreements();

        var isMobile = $(window).width() <= CALC_DESKTOP;
        var isChat   = (calcOffer === 'В чате');
        var messenger = '';

        if (isChat) {
            messenger = calcMessenger;
        }

        waSend      = isChat;
        waMessenger = messenger;

        var $f = $('.uc-tildaform');

        if (calcOffer === 'По телефону') {
            $f.find('input[name="name"]').val($('#uc-calc-name').val().trim());
            $f.find('input[name="phone"]').val($('#uc-calc-phone').val().trim());
        }

        $f.find('input[name="offer"]').val(calcOffer);
        $f.find('input[name="messenger"]').val(messenger);
        $f.find('input[name="sku-wa"]').val(typeof skuId !== 'undefined' ? skuId : '');

        if (isChat && messenger === 'web') {
            var payload = (typeof skuId !== 'undefined' ? skuId : '') +
                          '_' +
                          (typeof globalModelUtm !== 'undefined' ? globalModelUtm : '');
            window.isMaxOverlayActive = true;
            (function (p) {
                function tryOpen() {
                    if (typeof window.openTDWidget === 'function') {
                        window.openTDWidget(p);
                    } else {
                        setTimeout(tryOpen, 100);
                    }
                }
                setTimeout(tryOpen, 200);
            })(payload);
        }

        var $submitBtn = $f.find('.t-submit');
        if ($submitBtn.length) {
            $submitBtn.click();
        } else {
            $f.find('form').trigger('submit');
        }
    });

    /* ================================================================
       КВИЗ: uc:step LISTENER
    ================================================================ */
    $(document).ready(function () {
        // Скрыть .t-rec до получения uc:step
        var $t = $('#uc-gallery-custom').closest('.t-rec');
        if (!$t.length) $t = $('#uc-gallery-custom').parent();
        $t.hide();
        renderCalcAgreements();
    });

    setTimeout(function () {
        if (!$('#uc-calc-agreements').children().length) {
            renderCalcAgreements();
        }
    }, 1000);

    window.addEventListener('uc:step', function (e) {
        var $t = $('#uc-gallery-custom').closest('.t-rec');
        if (!$t.length) $t = $('#uc-gallery-custom').parent();
        if (e.detail.step === 2) {
            $t.show();
            $('#uc-gallery-custom').show();
            var el = $t[0];
            if (el) {
                el.classList.remove('uc-step-enter');
                void el.offsetWidth;
                el.classList.add('uc-step-enter');
            }
            var car = window.ucQuiz && window.ucQuiz.selectedCar;
            if (car) {
                window.updateGallery(car);
                fillGalInfo(car);
            }
            /* Инициализируем calc-секцию при каждом входе на шаг 2 */
            initCalcState();
            renderCalcAgreements();
            /* Сбрасываем способ связи на «В чате» при каждом входе */
            $('.uc-calc-method-btn').removeClass('uc-calc-method-btn--active');
            $('[data-calc-tab="chat"]').addClass('uc-calc-method-btn--active');
            calcOffer = 'В чате';
            $('#uc-calc-chat-section').show();
            $('#uc-calc-phone-section').hide();
            $('.uc-tildaform input[name="name"], .uc-tildaform input[name="phone"]')
                .prop('disabled', true);
            updateCalcBtnText();
            if (e.detail.scroll) {
                setTimeout(function() {
                    var top = $t.offset().top - 20;
                    window.scrollTo({ top: top, behavior: 'smooth' });
                }, 50);
            }
        } else {
            $t.hide();
            $('#uc-gallery-custom').hide();
        }
    });

    /* Квиз: nav-кнопки шага 2 */
    $(document).on('click', '#uc-gal-back', function () { window.ucQuiz.back(); });

    /* Resize-обработчик: пересчёт calc-состояния при смене ориентации */
    (function () {
        var _resizeTimer;
        $(window).on('resize', function () {
            clearTimeout(_resizeTimer);
            _resizeTimer = setTimeout(function () {
                if (calcOffer === 'В чате') {
                    initCalcState();
                }
            }, 200);
        });
    })();

    // Вспомогательная функция экранирования (нужна в fillGalInfo)
    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

})();
</script>
<!-- nominify end -->

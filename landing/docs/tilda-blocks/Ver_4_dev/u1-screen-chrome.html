<!-- nominify begin -->
<style>
/* ЦВЕТ КНОПКИ «ДАЛЕЕ →» НА ЭТОМ САЙТЕ — при вставке поменяйте два значения: --uc-btn-next-bg (кнопка) и --uc-btn-next-bg-hover (наведение). По умолчанию #2D5467 / #3C728D. В сборке (Production/, Production-test/) этого комментария нет: обычный комментарий сборщик удаляет, строка опознаётся по виду — первый <style> блока, в нём только :root с двумя значениями цвета. */
:root { --uc-btn-next-bg: #2D5467; --uc-btn-next-bg-hover: #3C728D; }
</style>
<style>
/* ================================================================
   U1 — Экранная обвязка

   Блок не рендерит собственную секцию на странице. Он владеет тем,
   что лежит ВНЕ квиза:
     • Hero (нативный Zero Block T396) как шаг 0 машины window.ucQuiz;
     • верхняя чёрная полоса секций квиза;
     • перехват кнопки «ВЫБРАТЬ АВТОМОБИЛЬ»;
     • вход в поп-ап контактов из шапки;
     • обезвреживание хэша #filter;
     • цвет кнопки «ДАЛЕЕ →» сайта — строка в самом начале блока.
       Сборка одна на все сайты, поэтому цвет правится руками при
       вставке (чек-лист выкладки). Читают U3 и U6 через
       var(--uc-btn-next-bg, #2D5467) — без строки кнопка тёмно-синяя.
       Комментарий с восклицательным знаком сборка сохраняет — он виден
       в Tilda. (Внутри этого комментария знаки конца комментария не писать.)

   Шапка сайта этим блоком НЕ правится: она остаётся прозрачной и
   absolute на всех экранах, как и везде на сайте.

   Порядок на странице: блок ставится ПОСЛЕ блока T809, который
   отбирает вариант Hero по UTM. Жёсткой зависимости от порядка нет —
   Hero ищется заново при каждом обращении (см. getHeroRec), — но
   соблюдать порядок всё равно стоит.
================================================================ */

/* ---- Пустой якорь блока (его .t-rec скрывается навсегда) ---- */
#uc-chrome-wrap { display: none; }

/* ================================================================
   ВЕРХНЯЯ ПОЛОСА СЕКЦИЙ КВИЗА

   Шапка — нативный Zero Block с прозрачным фоном и артбордом
   position: absolute поверх потока. Поверх фотографии Hero её светлый
   текст читается сам по себе. На белом фоне квиза — сливается и вдобавок
   накрывает верх секции: замер на живой странице показал заголовок
   «Выбор Автомобиля» в полосе 45–75px, целиком под шапкой (0–120px),
   и достать его скроллом нельзя.

   Красим не шапку, а сам квиз: верх активной секции получает чёрную
   полосу высотой со шапку, а её содержимое начинается ниже полосы.
   Прозрачная шапка ложится поверх и читается как единая плашка.

   Высота секции из-за полосы растёт — это ожидаемо и зафиксировано:
   шаг 1 становится выше вьюпорта и слегка скроллится.

   --uc-band — высота полосы. Значения ниже повторяют брейкпойнты высоты
   шапки в Zero Block (120 / 100 / 80) и работают ЗАПАСНЫМ вариантом:
   в рантайме переменная перезаписывается фактической высотой шапки
   (см. syncBandHeight). Статики недостаточно — Tilda масштабирует Zero
   Block через t396_initialScale и пишет артборду инлайновую высоту,
   посчитанную от ширины экрана, поэтому на узких устройствах реальная
   высота шапки расходится с объявленной в CSS.

   !important: Tilda пишет padding-top прямо в атрибут style каждого
   .t-rec, инлайн перебивает любой классовый селектор.
================================================================ */
:root { --uc-band: 120px; }
@media screen and (max-width: 1199px) { :root { --uc-band: 100px; } }
@media screen and (max-width: 959px)  { :root { --uc-band: 80px;  } }

html.uc-screen-quiz .uc-quiz-rec {
    position: relative;
    padding-top: var(--uc-band) !important;
}
/* ================================================================
   ЛЕЧЕНИЕ НАТИВНЫХ ПОП-АПОВ TILDA В ПРИТОРМОЖЕННОЙ ВКЛАДКЕ

   tilda-popup-1.0.min.js вешает блокировку скролла на <body> классом
   t-body_popupshowed СИНХРОННО по клику, а видимость поп-апа отдаёт
   CSS-переходу: .t-popup { opacity: 0; transition: opacity .3s }, и
   класс t-popup_show переводит opacity в 1.

   Если вкладка скрыта или приторможена, браузер не продвигает переход:
   класс t-popup_show стоит, а opacity так и остаётся 0. Снаружи это
   выглядит как «поп-ап не открылся, а скролл умер». Замерено на живой
   странице: после ~5 минут в фоне таймеры зажаты до одного срабатывания
   в минуту (дрейф ~59 с на тик), и поп-ап висел display:block с
   opacity:0 больше шести минут.

   Снимаем зависимость от перехода: показанный поп-ап непрозрачен сразу.
   Цена — исчезает плавное появление на 0.3 с у юридических текстов.

   Запрещать нужно ИМЕННО переход, а не только конечное значение: одного
   `opacity: 1 !important` мало — проверено, незавершённый переход
   продолжает управлять значением, пока не доиграет, и в приторможенной
   вкладке opacity так и оставался 0. Поэтому переход выключается совсем.
================================================================ */
.t-popup { transition: none !important; }
.t-popup.t-popup_show { opacity: 1 !important; }

html.uc-screen-quiz .uc-quiz-rec::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: var(--uc-band);
    /* Акцентный цвет шагов 1 и 2 — общий с выбранными плитками
       конфигурации и кнопками «ДАЛЕЕ →». */
    background: #51565C;
    pointer-events: none;
}
</style>

<!-- Пустой якорь: по нему блок находит свой .t-rec и скрывает его навсегда -->
<div id="uc-chrome-wrap"></div>

<script>
(function () {
    'use strict';

    /* ================================================================
       КОНСТАНТЫ

       HERO_CTA — селектор кнопки входа в квиз внутри Hero. По нему же
       опознаётся сам Hero: это .t-rec, внутри которого лежит кнопка.
       CONTACTS_CTA — служебный якорь ссылки «КОНТАКТЫ» в шапке.
       Он начинается с #!, потому что нативный T270 такие ссылки не
       трогает по своему селектору. HERO_CTA — штатный якорь Tilda,
       его перехватываем вручную (см. ниже).
    ================================================================ */
    var HERO_CTA     = 'a[href="#filter"]';
    var CONTACTS_CTA = 'a[href="#!contacts"]';
    var LEGACY_HASH  = '#filter';

    /* Якоря секций квиза — те же, по которым их находят собственные
       слушатели uc:step. U4 прячет себя сам и сюда не входит. */
    var QUIZ_ANCHORS = ['#uc-skeleton', '.uc-cards-block', '#uc-gallery-custom'];

    /* ================================================================
       ОБЕЗВРЕЖИВАНИЕ ХЭША #filter

       Нативный T270 при готовности документа читает location.hash и
       скроллит к якорю, а при клике по кнопке Hero дописывает #filter
       в историю. Клик мы перехватываем ниже, а хэш, оставшийся в URL
       с прошлого визита, к моменту t_onReady должен уже исчезнуть.

       Снятия на разборе страницы НЕ достаточно: проверка на живой
       странице показала, что к моменту readyState=complete хэш снова
       на месте, а документ проскроллен к якорю на 171px. Точка, где
       Tilda его возвращает, внутри её загрузчика, и полагаться на
       порядок инициализации там не стоит. Поэтому снятие идемпотентно
       и повторяется: на разборе, при готовности документа и ещё раз
       следующим тиком.
    ================================================================ */
    var _hadLegacyHash = (window.location.hash === LEGACY_HASH);

    function neutralizeLegacyHash() {
        if (window.location.hash !== LEGACY_HASH) return;
        if (window.history && typeof window.history.replaceState === 'function') {
            window.history.replaceState(null, '', window.location.pathname + window.location.search);
        } else {
            window.location.hash = '';
        }
    }

    neutralizeLegacyHash();

    /* ================================================================
       ПОИСК УЗЛОВ

       Hero ищется ЗАНОВО при каждом обращении, а не кэшируется на
       инициализации. Причина: нативный T809 удаляет неподходящие по UTM
       варианты Hero из DOM целиком (removeChild), и вариантов больше
       одного. Кэш, снятый до его работы, указывал бы на удалённый узел.
       Свежий поиск снимает всю зависимость от порядка инициализации —
       мы всегда работаем с тем Hero, который сейчас на странице.
    ================================================================ */
    function getHeroRec() {
        var btn = document.querySelector(HERO_CTA);
        return btn ? btn.closest('.t-rec') : null;
    }

    /* ----------------------------------------------------------------
       ВЫСОТА ЧЁРНОЙ ПОЛОСЫ = ФАКТИЧЕСКАЯ ВЫСОТА ШАПКИ

       Шапка опознаётся по единственному отличающему её признаку: её
       артборд позиционирован absolute поверх потока, у остальных Zero
       Block он статичный. Шапку при этом только ИЗМЕРЯЕМ — ни одного
       стиля ей не пишем.

       Измерение вместо захардкоженных брейкпойнтов: Zero Block
       масштабируется на узких экранах, и объявленные 80px превращаются
       в другое число. Полоса, равная фактической высоте шапки, центрирует
       её содержимое по построению — Zero Block центрирует элементы
       внутри артборда.
    ---------------------------------------------------------------- */
    function findHeaderArtboard() {
        var boards = document.querySelectorAll('.t-rec .t396__artboard');
        for (var i = 0; i < boards.length; i++) {
            if (window.getComputedStyle(boards[i]).position === 'absolute') return boards[i];
        }
        return null;
    }

    function syncBandHeight() {
        var board = findHeaderArtboard();
        if (!board) return;   // не нашли — остаются запасные значения из CSS
        var h = Math.round(board.getBoundingClientRect().height);
        if (h <= 0) return;   // шапка ещё не отрисована — не затираем запасное значение
        document.documentElement.style.setProperty('--uc-band', h + 'px');
    }

    function eachQuizRec(fn) {
        for (var i = 0; i < QUIZ_ANCHORS.length; i++) {
            var el = document.querySelector(QUIZ_ANCHORS[i]);
            if (!el) continue;
            var rec = el.closest('.t-rec');
            if (rec) fn(rec);
        }
    }

    /* ================================================================
       ИСТОРИЯ ДЛЯ ОВЕРЛЕЕВ

       Браузерный «назад» закрывает открытый оверлей вместо ухода со
       страницы. Между экранами история не ведётся — это решение из
       требований; здесь только оверлеи.

       Помощник живёт в этом блоке, а не в одном из поп-апов: потребителей
       двое (оснащение и контакты), и зависимость одного поп-апа от
       другого была бы лишней. Стек закрывающих функций поддерживает
       случай, когда оверлеи наложились друг на друга.

       _selfBack гасит popstate, который мы же и вызвали при закрытии
       крестиком: без него закрытие верхнего оверлея схлопнуло бы
       заодно и нижний.
    ================================================================ */
    var _overlayStack = [];
    var _selfBack = false;

    /* ----------------------------------------------------------------
       БЛОКИРОВКА СКРОЛЛА — ОДИН ВЛАДЕЛЕЦ

       Раньше U4 и U7 каждый писал в body.style.overflow сам. При двух
       открытых оверлеях закрытие верхнего безусловно снимало блокировку,
       и страница скроллилась за ещё открытым нижним — проверено на живой
       странице. Обратный отказ не менее вреден: если закрытие однажды не
       доедет, блокировка висит до перезагрузки, а снаружи это не
       отличить от «ничего не открылось».

       Поэтому состояние не переключают, а ПЕРЕСЧИТЫВАЮТ от факта: скролл
       заблокирован ровно тогда, когда открыт хотя бы один наш оверлей.
       Функция идемпотентна, её можно звать сколько угодно раз.

       Нативные попапы Tilda блокируют скролл КЛАССОМ t-body_popupshowed
       и инлайновый style не трогают (проверено на живой странице), так
       что здесь мы распоряжаемся только своим механизмом.
    ---------------------------------------------------------------- */
    var OUR_OVERLAYS = ['#uc-feat-popup', '#uc-contacts-popup'];

    function anyOverlayOpen() {
        for (var i = 0; i < OUR_OVERLAYS.length; i++) {
            var el = document.querySelector(OUR_OVERLAYS[i]);
            if (el && el.classList.contains('--visible')) return true;
        }
        return false;
    }

    function syncScrollLock(bySafetyNet) {
        var shouldLock = anyOverlayOpen();
        var isLocked   = document.body.style.overflow === 'hidden';
        if (shouldLock === isLocked) return;
        document.body.style.overflow = shouldLock ? 'hidden' : '';
        if (bySafetyNet) {
            console.warn('⚠️ U1: рассинхрон блокировки скролла исправлен страховкой — ' +
                         (shouldLock ? 'восстановлена' : 'снята'));
        }
    }

    /* Вызывают U4 и U7 сразу после того, как переключили свой --visible. */
    window.ucSyncScrollLock = function () { syncScrollLock(false); };

    /* ----------------------------------------------------------------
       СТОРОЖ ДЛЯ БЛОКИРОВКИ, КОТОРУЮ СТАВИТ САМА TILDA

       Нативные поп-апы блокируют скролл классом t-body_popupshowed.
       Если обработчик Tilda прервётся между установкой класса и показом
       поп-апа, класс остаётся, а показывать нечего — страница мертва до
       перезагрузки.

       Инвариант простой: класс на <body> имеет смысл, только когда в DOM
       есть хотя бы один показанный .t-popup. Нарушение инварианта чиним,
       в остальное время к чужому механизму не притрагиваемся.
    ---------------------------------------------------------------- */
    function healStuckTildaLock() {
        if (!document.body.classList.contains('t-body_popupshowed')) return;
        if (document.querySelector('.t-popup.t-popup_show')) return;
        document.body.classList.remove('t-body_popupshowed', 't390__body_popupshowed');
        console.warn('⚠️ U1: снят зависший t-body_popupshowed — показанных поп-апов Tilda в DOM нет');
    }

    window.ucOverlayHistory = {
        arm: function (closeFn) {
            if (typeof closeFn !== 'function') return;
            if (_overlayStack.indexOf(closeFn) !== -1) return;
            _overlayStack.push(closeFn);
            if (window.history && typeof window.history.pushState === 'function') {
                window.history.pushState({ ucOverlay: _overlayStack.length }, '', window.location.href);
            }
        },
        disarm: function (closeFn) {
            var i = _overlayStack.indexOf(closeFn);
            if (i === -1) return;
            _overlayStack.splice(i, 1);
            if (window.history && typeof window.history.back === 'function') {
                _selfBack = true;
                window.history.back();
            }
        }
    };

    window.addEventListener('popstate', function () {
        if (_selfBack) { _selfBack = false; syncScrollLock(true); return; }
        var closeFn = _overlayStack.pop();
        if (closeFn) closeFn();
        syncScrollLock(true);
    });

    /* Страховка срабатывает на каждой смене экрана и при возврате во
       вкладку — то есть на ближайшем же действии посетителя, а не после
       перезагрузки страницы. */
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) return;
        syncScrollLock(true);
        healStuckTildaLock();
    });

    /* ================================================================
       ПЕРЕХВАТ КНОПКИ ВХОДА

       Нативный T270 вешает ПРЯМОЙ bubble-обработчик на сам элемент
       ссылки и делает в нём preventDefault() + history.pushState.
       Чтобы встать раньше, слушаем на document в фазе перехвата:
       она проходит до того, как событие достигнет цели.

       userNavigated взводится явно, а не через next(): next() считает
       шаг от текущего, а нам нужен ровно шаг 1 из любого состояния.
       От флага зависит сброс скролла в слушателях шагов 1 и 2.
    ================================================================ */
    document.addEventListener('click', function (e) {
        var target = e.target;
        if (!target || typeof target.closest !== 'function') return;
        if (!target.closest(HERO_CTA)) return;

        e.preventDefault();
        e.stopPropagation();

        if (!window.ucQuiz) return;
        window.ucQuiz.userNavigated = true;
        window.ucQuiz.goTo(1);
    }, true);

    /* ================================================================
       ВХОД В КОНТАКТЫ

       Ссылка живёт в разметке шапки (добавляется вручную в редакторе
       Zero Block) — здесь только обработчик. Сам поп-ап принадлежит
       блоку контактов и открывается его экспортом, по тому же образцу,
       по которому U3 открывает поп-ап оснащения U4.
    ================================================================ */
    document.addEventListener('click', function (e) {
        var target = e.target;
        if (!target || typeof target.closest !== 'function') return;
        if (!target.closest(CONTACTS_CTA)) return;

        e.preventDefault();
        e.stopPropagation();

        if (typeof window.openContactsPopup === 'function') {
            window.openContactsPopup();
        } else {
            console.warn('⚠️ U1: блок контактов не загружен — openContactsPopup не определён');
        }
    }, true);

    /* ================================================================
       СЛУШАТЕЛЬ uc:step

       Шаг 0 — Hero. Любой другой шаг Hero прячет и включает верхнюю
       полосу секций квиза.
    ================================================================ */
    window.addEventListener('uc:step', function (e) {
        var hero = getHeroRec();
        var onHero = e.detail.step === 0;

        if (hero) hero.style.display = onHero ? '' : 'none';

        document.documentElement.classList.toggle('uc-screen-quiz', !onHero);
        syncBandHeight();
        syncScrollLock(true);
        healStuckTildaLock();

        /* Сброс скролла в начало экрана. У шагов 1 и 2 он живёт в их
           собственных слушателях, у шага 0 своего носителя нет.

           behavior: 'auto', а не 'smooth'. Показ Hero меняет высоту
           документа в тот же кадр, и браузер отменяет плавную анимацию
           на полпути — проверено на живой странице, скролл замирал на
           ~400px вместо нуля. Для подмены экрана мгновенный переход
           и по смыслу вернее плавного. */
        if (onHero && e.detail.scroll) {
            setTimeout(function () {
                window.scrollTo({ top: 0, behavior: 'auto' });
            }, 50);
        }
    });

    /* ================================================================
       ИНИЦИАЛИЗАЦИЯ

       Первый uc:step приходит только после загрузки каталога — это
       сетевой запрос. До него u3-card-sliders.html держит свою секцию
       видимой, показывая скелетон, то есть под Hero всё время загрузки
       торчала бы вторая секция. Ровно то состояние, которое эта
       переработка и убирает. Поэтому секции квиза прячутся здесь, не
       дожидаясь uc:ready; слушатели блоков после uc:step лишь
       подтвердят уже установленное состояние.

       Hero при этом трогать не нужно: он виден по умолчанию.
       Если посетитель успел нажать кнопку Hero раньше (шаг уже не 0),
       открытый шаг показывается заново — см. конец обработчика.
    ================================================================ */
    $(document).ready(function () {
        eachQuizRec(function (rec) {
            rec.classList.add('uc-quiz-rec');
            rec.style.display = 'none';
        });

        /* Второй и третий заход по хэшу (см. выше). Скролл возвращаем
           в начало только если пришли с legacy-хэшем: браузер уже успел
           проскроллить к якорю, а стартовый экран — всегда Hero. */
        if (_hadLegacyHash) {
            neutralizeLegacyHash();
            window.scrollTo(0, 0);
            setTimeout(function () {
                neutralizeLegacyHash();
                window.scrollTo(0, 0);
            }, 0);
        }

        /* Полоса меряется от шапки сразу и на каждом ресайзе: поворот
           устройства меняет масштаб Zero Block, а с ним и высоту шапки. */
        syncBandHeight();
        var _bandTimer;
        $(window).on('resize orientationchange', function () {
            clearTimeout(_bandTimer);
            _bandTimer = setTimeout(syncBandHeight, 150);
        });

        /* Секция U1 на странице не отображается никогда */
        var $t = $('#uc-chrome-wrap').closest('.t-rec');
        if (!$t.length) $t = $('#uc-chrome-wrap').parent();
        $t.hide();

        /* Посетитель нажал кнопку Hero раньше, чем дошли сюда: шаг уже
           не 0, а секции квиза только что спрятаны — экран был бы пустым
           до uc:ready. Повторяем шаг: его секция снова видна (скелет), и
           прокрутка идёт к ней по уже окончательной раскладке.
           План 2026-10-08-004. */
        if (window.ucQuiz && window.ucQuiz.step !== 0) {
            window.ucQuiz.goTo(window.ucQuiz.step);
        }
    });

})();
</script>
<!-- nominify end -->

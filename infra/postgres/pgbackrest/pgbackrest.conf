# pgBackRest платформы: архив журнала и копии базы в Yandex Object Storage (ARCHITECTURE.md 7.5).
# Секретов здесь нет. Бакет, ключи и пароль шифрования задаются переменными окружения контейнера
# (PGBACKREST_REPO1_S3_BUCKET, PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET,
# PGBACKREST_REPO1_CIPHER_PASS — из infra/.env). Опции — pgbackrest.org/configuration.html.

[global]
repo1-type=s3
repo1-s3-endpoint=storage.yandexcloud.net
# По документации Яндекса регион всегда ru-central1.
repo1-s3-region=ru-central1
repo1-s3-uri-style=path
repo1-path=/pgbackrest

# Хранение 30 дней: полные копии старше 30 дней удаляются вместе с их разностными и журналом.
repo1-retention-full-type=time
repo1-retention-full=30

# Шифрование на нашей стороне; без пароля шифрования копии не прочитать.
repo1-cipher-type=aes-256-cbc

compress-type=zst
# Один процесс — не больше 25 % CPU (docs/research/2026-10-16-server-sizing.md).
process-max=1
start-fast=y

# Архив журнала в фоне; очередь ограничена, чтобы при недоступном хранилище не забить диск.
archive-async=y
spool-path=/var/spool/pgbackrest
archive-push-queue-max=4GiB

log-level-console=info
log-level-file=off

[global:archive-push]
log-level-console=warn

[global:archive-get]
log-level-console=warn

[dealers]
pg1-path=/var/lib/postgresql/data
